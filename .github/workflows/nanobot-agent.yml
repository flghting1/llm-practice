name: Verify e-commerce Multi-Agent demo

on:
  push:
    paths:
      - "nanobot_agent_demo/**"
  pull_request:
    paths:
      - "nanobot_agent_demo/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nanobot_agent_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run workflow and API tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nanobot_agent_demo/webapp/package-lock.json
      - name: Build React demo
        working-directory: nanobot_agent_demo/webapp
        run: npm ci && npm run build
      - name: Validate Docker Compose configuration
        run: docker compose config
